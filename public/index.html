<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Issue Tracker</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 3rem auto; padding: 0 1rem; color: #17202a; }
      form { display: grid; gap: .75rem; max-width: 34rem; }
      input, textarea, button { font: inherit; padding: .65rem; }
      button { cursor: pointer; background: #17202a; color: white; border: 0; }
      li { margin: 1rem 0; padding: 1rem; border: 1px solid #d8dee4; list-style: none; }
      ul { padding: 0; }
    </style>
  </head>
  <body>
    <h1>Issue Tracker</h1>
    <form id="issue-form">
      <input name="project" placeholder="Project name" required>
      <input name="issue_title" placeholder="Issue title" required>
      <textarea name="issue_text" placeholder="Describe the issue" required></textarea>
      <input name="created_by" placeholder="Your name" required>
      <input name="assigned_to" placeholder="Assigned to (optional)">
      <input name="status_text" placeholder="Status (optional)">
      <button>Create issue</button>
    </form>
    <ul id="issues"></ul>
    <script>
      const form = document.querySelector('#issue-form');
      const list = document.querySelector('#issues');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        const project = data.project;
        delete data.project;
        const response = await fetch(`/api/issues/${encodeURIComponent(project)}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
        });
        const issue = await response.json();
        if (!response.ok) return alert(issue.error);
        const item = document.createElement('li');
        item.textContent = `${issue.issue_title}: ${issue.issue_text} (${issue.created_by})`;
        list.prepend(item);
        form.reset();
      });
    </script>
  </body>
</html>
